<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COM225 Group 2 Course Mates Gallery</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#f5f7fa,#dfe9f3);
    text-align:center;
    padding:20px;
}

h1{
    color:#222;
    margin-bottom:10px;
}

p{
    color:#555;
    margin-bottom:30px;
}

.gallery{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:25px;
}

.card{
    background:#fff;
    padding:10px;
    border-radius:15px;
    width:240px;
    box-shadow:0 5px 15px rgba(0,0,0,0.15);
    animation:slideIn 0.8s ease forwards;
    opacity:0;
}

.card:nth-child(1){animation-delay:0.1s;}
.card:nth-child(2){animation-delay:0.2s;}
.card:nth-child(3){animation-delay:0.3s;}
.card:nth-child(4){animation-delay:0.4s;}
.card:nth-child(5){animation-delay:0.5s;}
.card:nth-child(6){animation-delay:0.6s;}
.card:nth-child(7){animation-delay:0.7s;}
.card:nth-child(8){animation-delay:0.8s;}
.card:nth-child(9){animation-delay:0.9s;}

.card img{
    width:100%;
    height:280px;
    object-fit:cover;
    border-radius:12px;
    cursor:pointer;
    transition:0.4s;
}

.card img:hover{
    transform:scale(1.05);
}

.name{
    margin-top:10px;
    font-weight:bold;
    color:#333;
    font-size:15px;
}

@keyframes slideIn{
    from{
        transform:translateY(60px);
        opacity:0;
    }
    to{
        transform:translateY(0);
        opacity:1;
    }
}

/* Image Viewer */
.viewer{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.95);
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.viewer img{
    max-width:90%;
    max-height:90%;
    border-radius:15px;
}

.close{
    position:absolute;
    top:20px;
    right:30px;
    color:white;
    font-size:45px;
    cursor:pointer;
}
</style>
</head>

<body>

<h1>🎓 COM225 Group 2 Course Mates Gallery</h1>
<p>Click any photo to view it in full size.</p>

<div class="gallery">

<div class="card">
    <img src="mate1.jpg" onclick="openImage(this.src)">
    <div class="name">Okafor Esther Ada</div>
</div>

<div class="card">
    <img src="mate2.jpg" onclick="openImage(this.src)">
    <div class="name">Maduike Nkemdirim Loveth</div>
</div>

<div class="card">
    <img src="mate3.jpg" onclick="openImage(this.src)">
    <div class="name">Ekeh Maryann Nmesoma</div>
</div>

<div class="card">
    <img src="mate4.jpg" onclick="openImage(this.src)">
    <div class="name">Aliguzo Chidera Golden</div>
</div>

<div class="card">
    <img src="mate5.jpg" onclick="openImage(this.src)">
    <div class="name">Njoku Favour Chioma</div>
</div>

<div class="card">
    <img src="mate6.jpg" onclick="openImage(this.src)">
    <div class="name">Obinna Slyvernus Nwuju</div>
</div>

<div class="card">
    <img src="mate7.jpg" onclick="openImage(this.src)">
    <div class="name">Idjighere Ogheneyoma Emmanuel</div>
</div>

<div class="card">
    <img src="mate8.jpg" onclick="openImage(this.src)">
    <div class="name">Bearer Ben</div>
</div>

<div class="card">
    <img src="mate9.jpg" onclick="openImage(this.src)">
    <div class="name">Ogundu Glory Sopuruchi</div>
</div>

</div>

<div class="viewer" id="viewer">
    <span class="close" onclick="closeImage()">&times;</span>
    <img id="largeImage">
</div>

<script>
function openImage(src){
    document.getElementById("viewer").style.display="flex";
    document.getElementById("largeImage").src=src;
}

function closeImage(){
    document.getElementById("viewer").style.display="none";
}

document.getElementById("viewer").addEventListener("click", function(e){
    if(e.target===this){
        closeImage();
    }
});
</script>

</body>
</html>
